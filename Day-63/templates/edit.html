<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
    <h1>Edit {{ book.title }}'s Rating</h1>
    <form method="POST">
        <label>New Rating</label>
        <input type="text" name="rating" placeholder="{{ book.rating }}">
        <button type="submit">Update</button>
    </form>
</body>
</html>
