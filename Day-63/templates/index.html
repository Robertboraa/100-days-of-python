<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>My Library</h1>
    {% if books %}
    <ul>
        {% for book in books %}
<li style="margin-bottom: 10px;">
    {{ book.name }} — {{ book.author }} — ⭐ {{ book.rating }}
    &nbsp;
    <a href="/edit/{{ book.id }}">✏️ Edit</a>
    &nbsp;
    <a href="/delete/{{ book.id }}">🗑️ Delete</a>
</li>
{% endfor %}
    </ul>
{% else %}
    <p>Library is empty.</p>
{% endif %}

<a href="/add">Add New Book</a>
  </body>
</html>
